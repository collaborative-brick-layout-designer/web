name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Build & push tagged image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: repo
        # Every image goes out under two names while the project is renamed:
        # <owner>/web (the new name) and <owner>/collaborative-brick-layout-designer
        # (the name existing deploys pull). Both follow the org if it is renamed.
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=$owner/collaborative-brick-layout-designer" >> "$GITHUB_OUTPUT"
          echo "web=$owner/web" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # The image goes out first under its commit's tag only. :vX.Y.Z and
      # :latest point at it once the scan below has passed, so a CRITICAL
      # finding never leaves a vulnerable :latest for self-hosters to pull.
      - name: Build & push (commit tag only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.web }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy gate (CRITICAL fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        timeout-minutes: 15
        env:
          # The ECR mirror first: ghcr.io rate-limits the database downloads.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db
        with:
          timeout: 10m
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: /root/.local/share/pnpm,/home/runner/.local/share/pnpm

      # Only reached when the scan passed. Both names, both tags, the same
      # multi-arch image (the way nightly.yml moves :nightly).
      - name: Tag the scanned image :v${{ steps.ver.outputs.version }} and :latest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.repo.outputs.name }}:v${{ steps.ver.outputs.version }} \
            -t ghcr.io/${{ steps.repo.outputs.name }}:latest \
            -t ghcr.io/${{ steps.repo.outputs.web }}:v${{ steps.ver.outputs.version }} \
            -t ghcr.io/${{ steps.repo.outputs.web }}:latest \
            ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}

  release:
    name: Create GitHub Release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Stage release assets
        run: |
          mkdir -p release
          cp .env.example release/

      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag -l 'v*' --sort=-creatordate | grep -A1 "^${CURRENT_TAG}$" | tail -1)
          # The tag's own message only when it has one: a lightweight tag's
          # "contents" are the commit's message ("Merge pull request #…").
          # checkout can leave the tag lightweight locally; fetch the real one.
          git fetch --force origin "refs/tags/${CURRENT_TAG}:refs/tags/${CURRENT_TAG}"
          TAG_MSG=""
          if [ "$(git cat-file -t "$CURRENT_TAG")" = "tag" ]; then
            TAG_MSG=$(git tag -l --format='%(contents)' "$CURRENT_TAG" | sed '/-----BEGIN/,$d' | head -20)
          fi

          {
            echo 'BODY<<ENDOFNOTES'

            if [ -n "$TAG_MSG" ] && [ "$TAG_MSG" != "$CURRENT_TAG" ]; then
              echo "$TAG_MSG"
              echo ""
            fi

            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CURRENT_TAG" ]; then
              RANGE="${PREV_TAG}..${CURRENT_TAG}"
            else
              RANGE="HEAD~20..HEAD"
            fi

            COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges)

            BREAKING=$(echo "$COMMITS" | grep -E '^[a-z]+(\(.+\))?!: ' | sed 's/^/- /' || true)
            FEAT=$(echo "$COMMITS" | grep -E '^feat(\(.+\))?: ' | sed 's/^/- /' || true)
            FIX=$(echo "$COMMITS" | grep -E '^fix(\(.+\))?: ' | sed 's/^/- /' || true)
            PERF=$(echo "$COMMITS" | grep -E '^perf(\(.+\))?: ' | sed 's/^/- /' || true)
            DOCS=$(echo "$COMMITS" | grep -E '^docs(\(.+\))?: ' | sed 's/^/- /' || true)
            CI_BUILD=$(echo "$COMMITS" | grep -E '^(ci|build)(\(.+\))?: ' | sed 's/^/- /' || true)
            OTHER=$(echo "$COMMITS" | grep -vE '^(feat|fix|perf|docs|ci|build|style|refactor|test|chore|revert)(\(.+\))?!?: ' | sed 's/^/- /' || true)

            if [ -n "$BREAKING" ]; then
              echo "### ⚠ Breaking Changes"
              echo "$BREAKING"
              echo ""
            fi
            if [ -n "$FEAT" ]; then
              echo "### Features"
              echo "$FEAT"
              echo ""
            fi
            if [ -n "$FIX" ]; then
              echo "### Bug Fixes"
              echo "$FIX"
              echo ""
            fi
            if [ -n "$PERF" ]; then
              echo "### Performance"
              echo "$PERF"
              echo ""
            fi
            if [ -n "$DOCS" ]; then
              echo "### Documentation"
              echo "$DOCS"
              echo ""
            fi
            if [ -n "$CI_BUILD" ]; then
              echo "### Build & CI"
              echo "$CI_BUILD"
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "### Other Changes"
              echo "$OTHER"
              echo ""
            fi

            echo "### Image"
            echo ""
            echo "Pull with:"
            echo ""
            echo '```'
            echo "docker pull ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${CURRENT_TAG}"
            echo '```'

            echo 'ENDOFNOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
          body: ${{ steps.notes.outputs.BODY }}
          # v2.1.0-rc1 and the like are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
