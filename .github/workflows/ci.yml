name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per pull request: a newer push cancels the older run, which only
# held a runner. Runs on main, tags, schedules and by hand are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate PR commits
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          FAILED=0
          while IFS= read -r msg; do
            # skip merge commits
            if echo "$msg" | grep -qE '^Merge '; then continue; fi
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "::error::Bad commit message: $msg"
              echo "  Expected format: type(scope): description"
              echo "  Types: feat fix docs style refactor perf test build ci chore revert"
              FAILED=1
            fi
          done < <(git log --format='%s' origin/main..HEAD)

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "All commits must follow Conventional Commits: https://www.conventionalcommits.org"
            exit 1
          fi
          echo "All commits follow conventional commit format."

  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build  # must precede `test`: @cld/ydoc's tests import @cld/bbm's built dist/
      - run: pnpm test

  docker-image:
    # The nightly image is built from a narrower context than this checkout
    # (only what the Dockerfile copies), so a file the build needs but the
    # Dockerfile leaves out passes the tests above and fails only at night.
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: cbld-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image starts on empty volumes, as a self-hoster's first run does,
      # and its HEALTHCHECK reports healthy.
      - name: The image starts and reports healthy
        run: |
          docker volume create cbld-ci-data >/dev/null
          docker volume create cbld-ci-parts >/dev/null
          docker volume create cbld-ci-backups >/dev/null
          docker run -d --name cbld-ci -p 3000:3000 \
            -e DB_PATH=/data/cbld.sqlite -e PARTS_DIR=/parts -e BACKUPS_DIR=/backups \
            -e PUBLIC_URL=http://localhost:3000 -e COOKIE_SECURE=false \
            -v cbld-ci-data:/data -v cbld-ci-parts:/parts -v cbld-ci-backups:/backups \
            cbld-web:ci
          for i in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' cbld-ci 2>/dev/null || echo gone)
            [ "$status" = healthy ] && break
            [ "$status" = gone ] && break
            sleep 3
          done
          echo "Health: $status"
          docker logs cbld-ci 2>&1 | tail -40
          docker inspect -f '{{json .State.Health}}' cbld-ci | jq .
          [ "$status" = healthy ]
          curl -sf http://localhost:3000/api/health/ready
          # It runs as node (1000:1000), not root.
          [ "$(docker exec cbld-ci id -u):$(docker exec cbld-ci id -g)" = "1000:1000" ]
          docker rm -f cbld-ci >/dev/null

      # A volume an older image made belongs to root: the server stops at
      # once and says why, and the README's chown lets it start.
      - name: A root-owned volume stops it with a clear message
        run: |
          docker volume create cbld-ci-old >/dev/null
          docker run --rm -v cbld-ci-old:/data alpine:3.22 sh -c 'touch /data/cbld.sqlite && chown -R 0:0 /data && chmod 755 /data'
          set +e
          docker run --name cbld-ci-old -e DB_PATH=/data/cbld.sqlite -e PARTS_DIR=/parts -e BACKUPS_DIR=/backups \
            -v cbld-ci-old:/data cbld-web:ci > old.log 2>&1
          code=$?
          set -e
          cat old.log
          [ "$code" -ne 0 ]
          grep -q 'cbld: ERROR: the database folder /data is not writable by uid 1000 (gid 1000); it is owned by 0:0.' old.log
          docker rm -f cbld-ci-old >/dev/null
          # The README's fix, then it starts.
          docker run --rm -v cbld-ci-old:/data alpine:3.22 chown -R 1000:1000 /data
          docker run -d --name cbld-ci-old -p 3001:3000 -e DB_PATH=/data/cbld.sqlite -e PARTS_DIR=/parts -e BACKUPS_DIR=/backups \
            -e PUBLIC_URL=http://localhost:3001 -e COOKIE_SECURE=false -v cbld-ci-old:/data cbld-web:ci
          for i in $(seq 60); do curl -sf http://localhost:3001/api/health/ready && exit 0; sleep 2; done
          docker logs cbld-ci-old; exit 1

      # The image works as any uid:gid, with no account inside the image
      # (Unraid's nobody:users is 99:100): on fresh named volumes, with no
      # chown (Docker fills them from the image's 1777 folders), it starts,
      # reports healthy, writes to all three folders, loads its native
      # modules, and leaves nothing in a home folder or a package manager's
      # cache.
      - name: The image runs as an arbitrary user (99:100)
        run: |
          docker rm -f cbld-ci-old >/dev/null 2>&1 || true
          for v in data parts backups; do docker volume create cbld-ci-u-$v >/dev/null; done
          docker run -d --name cbld-ci-u -p 3002:3000 --user 99:100 \
            -e DB_PATH=/data/cbld.sqlite -e PARTS_DIR=/parts -e BACKUPS_DIR=/backups \
            -e PUBLIC_URL=http://localhost:3002 -e COOKIE_SECURE=false \
            -v cbld-ci-u-data:/data -v cbld-ci-u-parts:/parts -v cbld-ci-u-backups:/backups \
            cbld-web:ci
          for i in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' cbld-ci-u 2>/dev/null || echo gone)
            [ "$status" = healthy ] && break
            [ "$status" = gone ] && break
            sleep 3
          done
          echo "Health: $status"
          docker logs cbld-ci-u 2>&1 | tail -40
          [ "$status" = healthy ]
          curl -sf http://localhost:3002/api/health/ready
          # It really is 99:100, and the start line says so.
          [ "$(docker exec cbld-ci-u id -u):$(docker exec cbld-ci-u id -g)" = "99:100" ]
          docker logs cbld-ci-u 2>&1 | grep -q 'cbld: running as uid 99, gid 100'
          # Writes to every folder, as that user; the database it made is its own.
          docker exec cbld-ci-u sh -c 'for d in /data /parts /backups; do : > "$d/.ci-write" && rm "$d/.ci-write"; done'
          [ "$(docker exec cbld-ci-u stat -c %u:%g /data/cbld.sqlite)" = "99:100" ]
          # The native modules load for this user.
          docker exec -w /app/apps/server cbld-ci-u node -e "require('sharp'); require('argon2'); require('better-sqlite3'); console.log('native modules ok')"
          # Nothing in a home folder, and no package manager cache anywhere it could write.
          docker exec cbld-ci-u sh -c 'echo "HOME=$HOME"; [ "$HOME" = /tmp ]'
          docker exec cbld-ci-u sh -c '! find /home /tmp \( -name ".npm" -o -name ".pnpm*" -o -name ".cache" -o -name ".corepack" \) 2>/dev/null | grep .'
          docker exec cbld-ci-u sh -c '[ -z "$(find /home -newer /app/apps/server/dist -type f 2>/dev/null)" ]'
          docker rm -f cbld-ci-u >/dev/null

      # The same stop, for a user with no account in the image, on volumes
      # an older image left behind (root's, 0755, with files in them): the
      # message names the chown for the uid and gid it runs as, not a fixed 1000.
      - name: Root-owned volumes stop it as 12345:12345, naming that user's chown
        run: |
          for v in data parts backups; do
            docker volume create cbld-ci-r-$v >/dev/null
            docker run --rm -v cbld-ci-r-$v:/mnt alpine:3.22 sh -c 'touch /mnt/.old && chown -R 0:0 /mnt && chmod 755 /mnt'
          done
          set +e
          docker run --name cbld-ci-r --user 12345:12345 \
            -e DB_PATH=/data/cbld.sqlite -e PARTS_DIR=/parts -e BACKUPS_DIR=/backups \
            -v cbld-ci-r-data:/data -v cbld-ci-r-parts:/parts -v cbld-ci-r-backups:/backups \
            cbld-web:ci > root-owned.log 2>&1
          code=$?
          set -e
          cat root-owned.log
          echo "Exit code: $code"
          [ "$code" -ne 0 ]
          grep -q 'cbld: running as uid 12345, gid 12345' root-owned.log
          grep -q 'cbld: ERROR: the database folder /data is not writable by uid 12345 (gid 12345); it is owned by 0:0' root-owned.log
          grep -q 'cbld: ERROR: the parts folder /parts is not writable by uid 12345' root-owned.log
          grep -q 'cbld: ERROR: the backups folder /backups is not writable by uid 12345' root-owned.log
          grep -q 'chown -R 12345:12345 /data /parts /backups' root-owned.log
          docker rm -f cbld-ci-r >/dev/null

  osv-scan:
    name: OSV-Scanner (deps + actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # osv-scanner (bundled by action v2.1.0+) dropped --skip-git:
          # skipping .git is now the default, opted OUT of via the new
          # --include-git-root flag — so there's nothing to pass here for
          # the old behavior.
          scan-args: |-
            --recursive
            ./
