name: E2E stack
description: >
  Everything a Playwright run needs, after the repo is checked out: the pinned
  BlueBrick parts library, pnpm and Node, the packages built, Chromium, and the
  API server running on a fresh test database. The job sets DB_PATH,
  PARTS_DIR, BACKUPS_DIR and the server's other env.

inputs:
  parts-sha:
    description: The BlueBrick parts library commit to check out
    required: true

runs:
  using: composite
  steps:
    - name: Check out the BlueBrick parts library
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Lswbanban/BlueBrickParts
        ref: ${{ inputs.parts-sha }}
        path: .e2e/BlueBrickParts

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build the packages
      shell: bash
      run: pnpm -r --filter "./packages/*" build

    # Chromium and the system packages it needs (mostly fonts) come from
    # caches. On a slow day the Azure apt mirror took 4 to 8 minutes for
    # those 25 MB of fonts, so a night's shards waited on it one by one.
    - name: Playwright version and runner image
      id: pw
      shell: bash
      working-directory: apps/web
      run: |
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "image-os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright's browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

    # apt keeps the .deb files it downloads in this folder instead of
    # /var/cache/apt/archives. With them there, apt downloads only what
    # changed since: nothing, when the runner image is the same.
    - name: Point apt at the package cache
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/playwright-apt/partial"
        printf '%s\n' \
          "Dir::Cache::Archives \"$HOME/.cache/playwright-apt/\";" \
          'APT::Keep-Downloaded-Packages "true";' \
          'APT::Sandbox::User "root";' \
          | sudo tee /etc/apt/apt.conf.d/99-playwright-cache > /dev/null

    - name: Cache the apt packages Playwright needs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-apt/*.deb
        key: playwright-apt-${{ runner.arch }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
        restore-keys: |
          playwright-apt-${{ runner.arch }}-${{ steps.pw.outputs.image-os }}-

    - name: Install Chromium for Playwright
      shell: bash
      working-directory: apps/web
      run: |
        npx playwright install --with-deps chromium
        # Drop the files an older image's cache brought that this one no
        # longer offers, so the cache doesn't grow week by week, and leave
        # the rest readable for the cache step, which runs as this user.
        sudo apt-get autoclean -qq
        sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/playwright-apt"

    - name: Start the API server
      shell: bash
      working-directory: apps/server
      run: |
        mkdir -p "$BACKUPS_DIR"
        npx tsx src/db/migrate.ts
        nohup npx tsx src/index.ts > "$GITHUB_WORKSPACE/.e2e/server.log" 2>&1 &
        for i in $(seq 60); do
          curl -sf http://localhost:3000/api/health && exit 0
          sleep 1
        done
        echo "::error::The API server did not start"; cat "$GITHUB_WORKSPACE/.e2e/server.log"; exit 1
